version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: tyyoj-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tyyoj}
      POSTGRES_USER: ${POSTGRES_USER:-tyyoj_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tyyoj_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tyyoj-network

  redis:
    image: redis:8-alpine
    container_name: tyyoj-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tyyoj-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: tyyoj-mailpit-dev
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    networks:
      - tyyoj-network

volumes:
  postgres_data:
  redis_data:

networks:
  tyyoj-network:
    driver: bridge
